<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Sips Coffee Corner</title>
  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <header class="site-header small-header">
    <nav class="navbar">
      <a class="brand" href="index.html">Sips Coffee Corner</a>

      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About us</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>

    <section class="page-title">
      <h1>Come sip with us.</h1>

      <address>
        <p>
          <a href="mailto:bvlsebastian@gmail.com">bvlsebastian@gmail.com</a><br>
          <a href="tel:+491774768510">+49 177 4768510</a>
        </p>
      </address>
    </section>
  </header>

  <main>
    <section class="contact-layout">
      <figure>
        <img
          src="https://images.pexels.com/photos/20011903/pexels-photo-20011903.jpeg"
          alt="Coffee shop interior"
        >
      </figure>

      <section class="form-card">
        <h2>Contact Form</h2>

        <form>
          <p>
            <label for="name">Name</label>
            <input id="name" type="text" name="name">
          </p>

          <p>
            <label for="email">Email</label>
            <input id="email" type="email" name="email">
          </p>

          <p>
            <label for="message">Message</label>
            <textarea id="message" name="message"></textarea>
          </p>

          <button type="submit">Send</button>
        </form>
      </section>
    </section>
  </main>

  <footer>
    <p>© 2026 Sips Coffee Corner</p>
  </footer>
</body>
</html>
